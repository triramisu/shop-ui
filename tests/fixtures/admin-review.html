<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LOCAL QA — Admin Workspace</title>
    <style>
      body {
        margin: 0;
        background: #e7e9ec;
        font: 12px system-ui;
      }
      header {
        height: 44px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 6px 12px;
        background: #000e1f;
        color: white;
        white-space: nowrap;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      select {
        font: inherit;
        padding: 5px;
      }
      iframe {
        display: block;
        border: 0;
        background: white;
      }
    </style>
  </head>
  <body>
    <header>
      <b>LOCAL QA / ADMIN — dữ liệu trong bộ nhớ</b
      ><label
        >Kích thước<select id="size">
          <option>1440×1100</option>
          <option>1200×1000</option>
          <option>768×1024</option>
          <option>375×900</option>
          <option>812×375</option>
        </select></label
      ><label
        >Trang<select id="page">
          <option value="/admin">Tổng quan</option>
          <option value="/admin/users">Người dùng & STAFF</option>
          <option value="/admin/roles">Vai trò</option>
          <option value="/admin/permissions">Quyền hệ thống</option>
          <option value="/admin/refunds">Hoàn tiền</option>
          <option value="/admin/users/c0000000-0000-4000-8000-000000000005">
            Chi tiết khách hàng QA
          </option>
          <option value="/profile">Hồ sơ cá nhân</option>
          <option value="/admin/products">Sản phẩm</option>
          <option value="/admin/categories">Danh mục</option>
          <option value="/admin/inventory">Tồn kho</option>
          <option value="/admin/products/a0000000-0000-4000-8000-000000000001">
            Chi tiết sản phẩm QA
          </option>
          <option value="/admin/inventory/b0000000-0000-4000-8000-000000000002">
            Chi tiết kho QA
          </option>
        </select></label
      >
    </header>
    <iframe title="Bản xem thử quản trị local" src="/admin"></iframe>
    <script type="module">
      const frame = document.querySelector('iframe');
      const size = document.querySelector('#size');
      const page = document.querySelector('#page');
      const sizes = new Set([...size.options].map((o) => o.value));
      const params = new URLSearchParams(location.search);
      if (sizes.has(params.get('size'))) size.value = params.get('size');
      function resize() {
        const [width, height] = size.value.split('×').map(Number);
        frame.style.width = width + 'px';
        frame.style.height = height + 'px';
        document.body.style.minWidth = width + 'px';
      }
      size.addEventListener('change', resize);
      page.addEventListener('change', () => (frame.src = page.value));
      resize();
    </script>
  </body>
</html>
